name: Render Portal (kartu berita Brainwork.id)
on:
  push:
    paths: ["portal/**.json"]
  workflow_dispatch:
concurrency: render-portal
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: bash setup/fonts.sh
      - name: Render kartu baru / yang berubah
        run: |
          for f in portal/*.json; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .json)
            if [ ! -f "aset/$id/$id.jpg" ] || [ "$(cat "aset/$id/.spec.md5" 2>/dev/null)" != "$(md5sum "$f" | cut -c1-32)" ]; then
              rm -rf "aset/$id"; echo "== $id"
              python render_portal.py "$f" "aset/$id" && md5sum "$f" | cut -c1-32 > "aset/$id/.spec.md5"
            fi
          done
      - name: Simpan hasil
        run: |
          git config user.name "brainwork-bot"
          git config user.email "bot@users.noreply.github.com"
          git add aset
          files=$(git diff --cached --name-only -- aset)
          git diff --cached --quiet || (git commit -m "render: kartu portal" && git pull --rebase && git push)
          bash setup/purge_cdn.sh $files
