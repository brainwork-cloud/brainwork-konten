name: Render Reels Motion
on:
  push:
    paths: ["motion/**.json"]
  workflow_dispatch:
concurrency: render-motion
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pillow numpy
      - run: bash setup/fonts.sh
      - name: Render spec baru / yang berubah
        run: |
          for f in motion/*.json; do
            id=$(basename "$f" .json)
            if [ ! -f "aset/$id/$id.mp4" ] || [ "$(git log -1 --format=%ct -- "$f")" -gt "$(git log -1 --format=%ct -- "aset/$id" 2>/dev/null || echo 0)" ]; then
              rm -rf "aset/$id"; echo "== $id"; python render_motion.py "$f" "aset/$id" || echo "$id $(date -u +%FT%TZ)" >> motion_gagal.txt
            fi
          done
      - name: Simpan hasil
        run: |
          git config user.name "brainwork-bot"
          git config user.email "bot@users.noreply.github.com"
          git add aset motion_gagal.txt 2>/dev/null || git add aset
          git diff --cached --quiet || (git commit -m "render: reels motion" && git pull --rebase && git push)
