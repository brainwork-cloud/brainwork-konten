name: Render Reels Motion
on:
  push:
    paths: ["motion/**.json"]
  workflow_dispatch:
concurrency: render-motion
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pillow numpy
      - run: bash setup/fonts.sh
      - name: Render spec baru / yang berubah (REVISI = md5 spec beda dari aset/<ID>/.spec.md5)
        run: |
          for f in motion/*.json; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .json)
            h=$(md5sum "$f" | cut -c1-32)
            if [ ! -f "aset/$id/$id.mp4" ] || [ "$(cat "aset/$id/.spec.md5" 2>/dev/null)" != "$h" ]; then
              rm -rf "aset/$id"; echo "== $id"
              if python render_motion.py "$f" "aset/$id"; then echo "$h" > "aset/$id/.spec.md5"; else echo "$id $(date -u +%FT%TZ)" >> motion_gagal.txt; fi
            fi
          done
      - name: Simpan hasil
        run: |
          git config user.name "brainwork-bot"
          git config user.email "bot@users.noreply.github.com"
          git add aset
          [ -f motion_gagal.txt ] && git add motion_gagal.txt || true
          files=$(git diff --cached --name-only -- aset)
          git diff --cached --quiet || (git commit -m "render: reels motion" && git pull --rebase && git push)
          bash setup/purge_cdn.sh $files
