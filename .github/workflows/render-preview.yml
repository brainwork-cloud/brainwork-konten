name: Render Pratinjau (uji foto/ilustrasi portal dan nopal-car-*/nopal-mot-*, tidak diposting)
on:
  push:
    paths: ["preview/*.json"]
  workflow_dispatch:
concurrency: render-preview
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pillow numpy requests
      - run: bash setup/fonts.sh
      - name: Render semua preview/*.json ke preview/out/<ID>/ (log foto di preview/out/<ID>.log)
        run: |
          mkdir -p preview/out
          for f in preview/*.json; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .json)
            rm -rf "preview/out/$id"
            case "$id" in
              nopal-car-*) python render_carousel.py "$f" "preview/out/$id" > "preview/out/$id.log" 2>&1 || echo "RENDER GAGAL" >> "preview/out/$id.log" ;;
              nopal-mot-*) python render_motion.py "$f" "preview/out/$id" > "preview/out/$id.log" 2>&1 || echo "RENDER GAGAL" >> "preview/out/$id.log" ;;
              *) python render_portal.py "$f" "preview/out/$id" > "preview/out/$id.log" 2>&1 || echo "RENDER GAGAL" >> "preview/out/$id.log" ;;
            esac
          done
      - name: Simpan hasil
        run: |
          git config user.name "brainwork-bot"
          git config user.email "bot@users.noreply.github.com"
          git add preview
          git diff --cached --quiet || (git commit -m "render: pratinjau portal" && git pull --rebase && git push)
