name: Render Carousel
on:
  push:
    paths: ["specs/**.json"]
  workflow_dispatch:
concurrency: render-carousel
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow gdown
      - run: bash setup/fonts.sh
      - name: Unduh screenshot ilustrasi dari Drive
        run: python fetch_media.py specs || true
      - name: Render spec baru / yang berubah
        run: |
          for f in specs/*.json; do
            id=$(basename "$f" .json)
            # render ulang kalau spec lebih baru dari hasil (untuk REVISI)
            if [ ! -f "aset/$id/${id}_01.jpg" ] || [ "$(git log -1 --format=%ct -- "$f")" -gt "$(git log -1 --format=%ct -- "aset/$id" 2>/dev/null || echo 0)" ]; then
              rm -rf "aset/$id"; echo "== $id"; python render_carousel.py "$f" "aset/$id"
            fi
          done
      - name: Simpan hasil
        run: |
          git config user.name "brainwork-bot"
          git config user.email "bot@users.noreply.github.com"
          git add aset
          git diff --cached --quiet || (git commit -m "render: carousel" && git pull --rebase && git push)
