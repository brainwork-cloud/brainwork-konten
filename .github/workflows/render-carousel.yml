name: Render Carousel
on:
  push:
    paths: ["specs/**.json"]
  workflow_dispatch:
concurrency: render-carousel
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow gdown
      - run: bash setup/fonts.sh
      - name: Hapus hasil lama kalau spec berubah (REVISI)
        run: |
          for f in specs/*.json; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .json)
            if [ -d "aset/$id" ] && [ "$(cat "aset/$id/.spec.md5" 2>/dev/null)" != "$(md5sum "$f" | cut -c1-32)" ]; then
              echo "spec berubah: $id"; rm -rf "aset/$id" "ilustrasi/$id"
            fi
          done
      - name: Unduh screenshot ilustrasi dari Drive
        run: python fetch_media.py specs || true
      - name: Render spec baru / yang berubah
        run: |
          for f in specs/*.json; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .json)
            if [ ! -f "aset/$id/${id}_01.jpg" ]; then
              rm -rf "aset/$id"; echo "== $id"
              python render_carousel.py "$f" "aset/$id" && md5sum "$f" | cut -c1-32 > "aset/$id/.spec.md5"
            fi
          done
      - name: Simpan hasil
        run: |
          git config user.name "brainwork-bot"
          git config user.email "bot@users.noreply.github.com"
          git add aset
          files=$(git diff --cached --name-only -- aset)
          git diff --cached --quiet || (git commit -m "render: carousel" && git pull --rebase && git push)
          bash setup/purge_cdn.sh $files
